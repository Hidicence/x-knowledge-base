<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">XKB: knowledge that shows up before anyone asks</title>
  <desc id="desc">Someone states a plan in conversation without asking a question. XKB searches the cards, wiki and past conversations it keeps, a relevance judge keeps what fits, and up to three source-linked items reach the answering agent's context. This is a conceptual flow, not a screenshot.</desc>
  <rect width="1200" height="480" rx="16" fill="#132724"/>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <g id="identity">
      <text x="56" y="52" font-size="20" letter-spacing="3" fill="#ACC0B7">YOUR KNOWLEDGE, BROUGHT INTO THE CONVERSATION</text>
      <text x="49" y="196" font-size="140" font-weight="750" letter-spacing="-6" fill="#F4F1E8">XKB</text>
      <text x="372" y="136" font-size="44" font-weight="600" fill="#F4F1E8">Knowledge that shows up</text>
      <text x="372" y="188" font-size="44" font-weight="600" fill="#F4F1E8">before anyone asks.</text>
    </g>
    <path d="M56 232 H1144" stroke="#42635A" stroke-width="2"/>
    <g id="flow">
      <g font-size="15" font-weight="600" letter-spacing="2" fill="#82D5BC">
        <text x="56" y="268">SOMEONE SAYS</text>
        <text x="456" y="268">XKB FINDS AND JUDGES</text>
        <text x="816" y="268">THE AGENT SEES, UP TO 3</text>
      </g>
      <g id="utterance">
        <rect x="56" y="284" width="320" height="100" rx="16" fill="#1A3530" stroke="#42635A" stroke-width="2"/>
        <path d="M84 384 L76 404 L104 384" fill="#1A3530" stroke="#42635A" stroke-width="2" stroke-linejoin="round"/>
        <rect x="80" y="382" width="26" height="4" fill="#1A3530"/>
        <g font-size="20" fill="#F4F1E8">
          <text x="78" y="322">“Next shot: the family</text>
          <text x="78" y="350">eating fish. Keep it stable.”</text>
        </g>
        <text x="78" y="374" font-size="15" fill="#ACC0B7">a plan, not a question</text>
      </g>
      <path d="M390 334 H440 M430 324 L440 334 L430 344" fill="none" stroke="#82D5BC" stroke-width="2"/>
      <g id="recall">
        <rect x="456" y="284" width="280" height="100" rx="12" fill="none" stroke="#42635A" stroke-width="2"/>
        <g font-size="18" fill="#F4F1E8">
          <text x="476" y="318">Searches cards, wiki</text>
          <text x="476" y="344">and past conversations</text>
        </g>
        <text x="476" y="370" font-size="16" fill="#82D5BC">a judge keeps what fits</text>
      </g>
      <path d="M750 334 H800 M790 324 L800 334 L790 344" fill="none" stroke="#82D5BC" stroke-width="2"/>
      <g id="delivered">
        <g fill="#1A3530" stroke="#42635A" stroke-width="2">
          <rect x="816" y="284" width="328" height="28" rx="6"/>
          <rect x="816" y="320" width="328" height="28" rx="6"/>
          <rect x="816" y="356" width="328" height="28" rx="6"/>
        </g>
        <g fill="#82D5BC">
          <rect x="816" y="284" width="5" height="28" rx="2"/>
          <rect x="816" y="320" width="5" height="28" rx="2"/>
          <rect x="816" y="356" width="5" height="28" rx="2"/>
        </g>
        <g font-size="16" fill="#F4F1E8">
          <text x="834" y="303">One main action per shot</text>
          <text x="834" y="339">Hands and wide shots over faces</text>
          <text x="834" y="375">Fix the subject with the first frame</text>
        </g>
        <text x="1144" y="404" font-size="14" text-anchor="end" fill="#ACC0B7">each with its source</text>
      </g>
    </g>
    <path d="M56 420 H1144" stroke="#42635A" stroke-width="2"/>
    <g font-size="18" font-weight="600" letter-spacing="2">
      <text x="56" y="452" fill="#ACC0B7">CARDS · WIKI · CONVERSATIONS</text>
      <text x="1144" y="452" text-anchor="end" fill="#82D5BC">ONE RECALL CORE · MCP / HTTP / CLI</text>
    </g>
  </g>
</svg>
