<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">XKB — evidence your agents can use</title>
  <desc id="desc">Source-linked cards, wiki knowledge and captured conversations feed one shared recall core, available through MCP, HTTP and CLI clients. This is a conceptual map, not a screenshot.</desc>
  <rect width="1200" height="480" rx="16" fill="#132724"/>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <g id="identity">
      <text x="56" y="52" font-size="22" letter-spacing="3" fill="#ACC0B7">YOUR SOURCES. SHARED KNOWLEDGE.</text>
      <text x="49" y="208" font-size="158" font-weight="750" letter-spacing="-7" fill="#F4F1E8">XKB</text>
      <text x="398" y="148" font-size="46" font-weight="600" fill="#F4F1E8">Evidence your</text>
      <text x="398" y="204" font-size="46" font-weight="600" fill="#F4F1E8">agents can use.</text>
      <path d="M1032 103 H1110 V190 H1032 Z M1048 126 H1093 M1048 143 H1083 M1048 160 H1093" fill="none" stroke="#82D5BC" stroke-width="3"/>
      <path d="M1020 115 H1005 V204 H1090 V199" fill="none" stroke="#42635A" stroke-width="3"/>
    </g>
    <g id="evidence-sources">
      <path d="M56 257 H1144" stroke="#42635A" stroke-width="2"/>
      <g fill="#F4F1E8" font-size="32" font-weight="550">
        <text x="56" y="310">Cards</text>
        <text x="425" y="310">Wiki</text>
        <text x="794" y="310">Conversations</text>
      </g>
      <g fill="#ACC0B7" font-size="22">
        <text x="56" y="346">Keep the source.</text>
        <text x="425" y="346">Build understanding.</text>
        <text x="794" y="346">Preserve the context.</text>
      </g>
      <g fill="none" stroke="#42635A" stroke-width="2">
        <path d="M66 366 V390 H1134 V366 M435 366 V390"/>
      </g>
      <g fill="#82D5BC">
        <circle cx="66" cy="366" r="4"/>
        <circle cx="435" cy="366" r="4"/>
        <circle cx="1134" cy="366" r="4"/>
      </g>
    </g>
    <g id="shared-recall" fill="#82D5BC" font-size="24" font-weight="600">
      <text x="56" y="443">ONE RECALL CORE</text>
      <path d="M530 435 H648 M638 425 L648 435 L638 445" fill="none" stroke="#82D5BC" stroke-width="2"/>
      <text x="1144" y="443" text-anchor="end">MCP / HTTP / CLI</text>
    </g>
  </g>
</svg>
